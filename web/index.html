<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Boy</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="buttons.css">
    <style>
        body {
          font-family: sans-serif;
          touch-action: manipulation;
        }
        .gameboy {
          width: fit-content;
          margin: auto;
          background-color: lightgray;
          padding: 36px;
          color: darkblue;
          -webkit-user-select: none;
          user-select: none;
        }
        @media (min-width: 480px) {
          .gameboy {
            border-radius: 36px 36px 128px 36px;
          }
        }
        .bezel {
          background: grey;
          border-radius: 12px 12px 56px 12px;
          margin: 24px 8px;
          padding: 18px 48px;
        }
        @media (min-width: 480px) {
          .bezel {
            padding: 32px 96px;
            max-width: fit-content;
          }
        }
        #screen-container {
          position: relative;
          width: 480px;
          height: 432px;
        }
        #screen, #rom-drop-zone, #start-overlay {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        #rom-drop-zone {
          background: #1a1a2e;
          color: #a0a0c0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          font-size: 16px;
          cursor: pointer;
        }
        #rom-drop-zone .upload-icon {
          color: #d0d0e8;
        }
        #start-overlay {
          background: #1a1a2e;
          border: none;
          cursor: pointer;
          display: none;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          color: #a0a0c0;
          font-size: 16px;
          font-family: sans-serif;
        }
        #start-overlay .play-icon {
          font-size: 56px;
          color: #d0d0e8;
        }
        #game-pak-input {
          display: none;
        }

        @media (max-width: 480px) {
          body {
            margin: 0;
            overflow: hidden;
          }
          .gameboy {
            width: 100%;
            min-height: 100dvh;
            padding: 16px;
            border-radius: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
          }
          #screen-container {
            width: 100%;
            height: auto;
            aspect-ratio: 10 / 9;
          }
          #screen canvas {
            width: 100% !important;
            height: auto !important;
          }
        }
    </style>
</head>
<body>
    <div class="gameboy">
        <button id="menu-button" popovertarget="game-menu" popovertargetaction="toggle" aria-label="Meny">&#9776;</button>
        <div popover id="game-menu">
            <button class="menu-item" id="mute-button"></button>
            <button class="menu-item" id="reset-combo-button">Start+Select+A+B</button>
            <button class="menu-item" id="eject-button">Løs ut kassett</button>
        </div>
        <div class="bezel">
            <div id="screen-container">
                <div id="screen"></div>
                <button id="start-overlay" aria-label="Start spillet">
                    <span class="play-icon">&#9654;</span>
                    <span>Trykk for å starte</span>
                </button>
                <label id="rom-drop-zone">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="16 10 12 6 8 10"></polyline>
                        <line x1="12" y1="6" x2="12" y2="18"></line>
                        <line x1="5" y1="21" x2="19" y2="21"></line>
                    </svg>
                    <span>Last opp Game Boy-spill</span>
                    <input type="file" id="game-pak-input" accept=".gb" />
                </label>
            </div>
        </div>
        <div class="controls-upper-row">
            <div class="dpad">
                <button class="dpad-up" data-key="ArrowUp" aria-label="Opp"></button>
                <button class="dpad-left" data-key="ArrowLeft" aria-label="Venstre"></button>
                <div class="dpad-center"></div>
                <button class="dpad-right" data-key="ArrowRight" aria-label="Høyre"></button>
                <button class="dpad-down" data-key="ArrowDown" aria-label="Ned"></button>
                <div class="dpad-touch-overlay" data-dpad></div>
            </div>
            <div class="ab-buttons">
                <label class="button-with-text-below">
                    <button data-key="x" aria-label="B"></button>
                    B
                </label>
                <label class="button-with-text-below">
                    <button data-key="z" aria-label="A"></button>
                    A
                </label>
            </div>
        </div>
        <div class="controls-lower-row">
            <div class="meta-buttons">
                <label class="button-with-text-below">
                    <button data-key="Backspace" aria-label="Select"></button>
                    SELECT
                </label>
                <label class="button-with-text-below">
                    <button data-key="Enter" aria-label="Start"></button>
                    START
                </label>
            </div>
        </div>
    </div>
</body>
<script type="module" src="main.js"></script>
</html>
